# Rosa Ondoño · prototipo web v3 en Netlify
# El sitio ya está generado en sitio/ (python3 generar_sitio.py): Netlify solo lo publica.
[build]
  publish = "sitio"
  command = "echo 'Sitio pregenerado con generar_sitio.py'"

# Funciones de servidor (web v3): /api/huecos, /api/reserva y /api/regalo
# Google Calendar y aviso de WhatsApp (CallMeBot). Claves solo en variables de entorno de Netlify.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Prototipo: fuera de Google mientras no sea la web oficial (el HTML ya trae canonical a rosaondono.com)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
